# ── Font ──────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        12.0
disable_ligatures never

# ── Jendela ───────────────────────────────────────
window_padding_width 12 16
background_opacity   0.72
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell    no
remember_window_size no
initial_window_width  110c
initial_window_height 30c

# ── Kursor ────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0

# ── Scroll dan URL ────────────────────────────────
scrollback_lines 5000
url_style        curly
mouse_hide_wait  3.0

# ── Tab bar (muncul hanya jika ada 2 tab atau lebih)
tab_bar_min_tabs        2
tab_bar_edge            top
tab_bar_style           fade
tab_fade                1
active_tab_font_style   bold
inactive_tab_font_style normal

# ── Warna (senada dengan Waybar) ──────────────────
foreground              #e6eef0
background              #0e1e26
selection_foreground    #0e1e26
selection_background    #9fd8e6
cursor                  #ffffff
cursor_text_color       #0e1e26
url_color               #9fd8e6

active_tab_foreground   #0e1e26
active_tab_background   #9fd8e6
inactive_tab_foreground #7f9ea8
inactive_tab_background #16303b

