add_newline = true

format = """
[╭─](fg:#4a606a) $username$hostname$directory$git_branch$git_status$cmd_duration
[╰─](fg:#4a606a)$character"""

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold fg:#9fd8e6"
style_root = "bold fg:#e27878"

[hostname]
ssh_only = false
format = "[@$hostname]($style) "
style = "bold fg:#e6eef0"

[directory]
format = "[\uf07b $path]($style)[$read_only]($read_only_style) "
style = "bold fg:#9fd8e6"
read_only = " \uf023"
read_only_style = "fg:#e27878"
home_symbol = "~"
truncation_length = 5
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
format = "[\ue0a0 $branch]($style) "
style = "fg:#b8a1d9"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "fg:#e5c76b"

[cmd_duration]
min_time = 2000
format = "[took $duration]($style)"
style = "fg:#7f9ea8"

[character]
success_symbol = "[❯](bold fg:#9fd8e6)"
error_symbol = "[❯](bold fg:#e27878)"
